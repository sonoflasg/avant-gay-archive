name: "Addition to an existing entry"
description: Add sourced facts, links or context to an entry that already exists. Nothing existing is changed.
title: "[entry name] addition: "
labels: [submission, addition]
body:
  - type: markdown
    attributes:
      value: |
        Keep the entry name in the title, e.g. `[Drifella] addition: Scatter mint page`. To fix something wrong, use **Correction**. To dispute a claim, use **Perspective**. To ask for a Community entry (yours, or one about you) to be changed or removed, use this form or **Correction** and say that clearly. Rules: [AGENTS.md](https://github.com/sonoflasg/avant-gay-archive/blob/main/AGENTS.md).
  - type: input
    id: entry
    attributes:
      label: Existing entry
      placeholder: e.g. Drifella III
    validations:
      required: true
  - type: textarea
    id: material
    attributes:
      label: What to add
      description: "The text you propose (attributed, neutral), or the material and what it shows. First-hand accounts are welcome; say they are first-hand."
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources
      description: One public URL per line. X posts as https://x.com/handle/status/id with the date and time in Melbourne time (AEDT/AEST).
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: Did you use an LLM or agent?
      options:
        - "No"
        - "Yes, and a human checked every claim against its source"
        - "Yes, not fully checked by a human"
    validations:
      required: true
  - type: input
    id: ai_which
    attributes:
      label: If yes, which one?
      placeholder: "e.g. the model or agent name"
  - type: input
    id: credit
    attributes:
      label: How should you be credited?
      placeholder: "@yourhandle (or anonymous)"
  - type: checkboxes
    id: rules
    attributes:
      label: Rules
      options:
        - label: "Only public sources: no DMs or private chats without everyone's consent, no wallet addresses, keys or seed phrases, no real names of pseudonymous people, no unverified allegations, no shilling."
          required: true
