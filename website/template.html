<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVANT GAY — a living archive</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="alternate icon" href="favicon.ico" sizes="16x16 32x32 48x48">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<style>
  :root {
    --bg: #0b0b10;
    --ink: #e8e6e3;
    --dim: #6b6a75;
    --accent: #ff4fa3;
    --accent2: #7bdcff;
    --panel: rgba(18, 17, 26, 0.82);
    --hair: rgba(255,255,255,0.09);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: var(--bg); color: var(--ink);
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
  canvas { display: block; cursor: grab; }
  canvas:active { cursor: grabbing; }

  /* ---------- header ---------- */
  #hdr {
    position: fixed; top: 0; left: 0; right: 0; z-index: 10;
    display: flex; align-items: baseline; gap: 14px;
    padding: 16px 22px; pointer-events: none;
  }
  #hdr h1 { font-size: 17px; letter-spacing: 0.28em; font-weight: 700; }
  #hdr h1 em { color: var(--accent); font-style: normal; }
  #hdr span { font-size: 11px; color: var(--dim); letter-spacing: 0.08em; }
  #hdr a { color: var(--accent2); text-decoration: none; pointer-events: auto; }
  #hdr a:hover { text-decoration: underline; }

  /* ---------- search ---------- */
  #search {
    position: fixed; top: 14px; right: 22px; z-index: 12;
    background: var(--panel); border: 1px solid var(--hair); border-radius: 20px;
    color: var(--ink); padding: 8px 16px; font-size: 12.5px; width: 210px;
    outline: none; backdrop-filter: blur(12px);
  }
  #search::placeholder { color: var(--dim); }
  #resetView {
    position: fixed; top: 14px; right: 244px; z-index: 12;
    background: var(--panel); border: 1px solid var(--hair); border-radius: 20px;
    color: var(--dim); padding: 8px 14px; font-size: 12px; font-family: inherit;
    cursor: pointer; backdrop-filter: blur(12px); letter-spacing: 0.03em;
  }
  #resetView:hover, #resetView:focus-visible { color: var(--ink); border-color: var(--accent2); outline: none; }
  #search:focus { border-color: var(--accent); }

  /* ---------- keyword sidebar ---------- */
  #keys {
    position: fixed; left: 0; top: 60px; bottom: 0; width: 216px; z-index: 10;
    padding: 10px 0 24px 16px; overflow-y: auto;
    scrollbar-width: thin; scrollbar-color: #333 transparent;
    mask-image: linear-gradient(to bottom, transparent, black 14px, black calc(100% - 14px), transparent);
  }
  #keys h2 { font-size: 10px; letter-spacing: 0.24em; color: var(--dim);
    text-transform: uppercase; margin: 0 0 10px 6px; }
  .key {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: none; color: var(--ink); text-align: left;
    padding: 5px 8px; font-size: 12.5px; cursor: pointer; border-radius: 6px;
    font-family: inherit;
  }
  .key:hover { background: rgba(255,255,255,0.06); }
  .key.active { background: rgba(255, 79, 163, 0.14); color: var(--accent); }
  .key .n { color: var(--dim); font-size: 10.5px; min-width: 20px; }
  .key .bar { height: 3px; background: var(--accent); opacity: 0.55; border-radius: 2px; }

  /* ---------- detail panel ---------- */
  #panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 400px; max-width: 92vw; z-index: 20;
    background: var(--panel); backdrop-filter: blur(18px);
    border-left: 1px solid var(--hair);
    transform: translateX(105%); transition: transform 0.32s cubic-bezier(.2,.8,.2,1);
    display: flex; flex-direction: column;
  }
  #panel.open { transform: translateX(0); }
  #panel header { padding: 26px 28px 14px; border-bottom: 1px solid var(--hair); }
  #panel .ptype { font-size: 10px; letter-spacing: 0.24em; text-transform: uppercase; margin-bottom: 8px; }
  #panel h2 { font-size: 22px; font-weight: 700; line-height: 1.2; }
  #panel .meta { margin-top: 8px; font-size: 11.5px; color: var(--dim); }
  #pPfp { display: flex; gap: 12px; align-items: center; margin-top: 12px; }
  #pPfp:empty { display: none; }
  #pPfp img { width: 44px; height: 44px; border-radius: 50%; flex: none; object-fit: cover; border: 1.5px solid var(--hair); }
  #pPfp .cap { font-size: 11px; line-height: 1.45; color: var(--dim); }
  #pPfp a { color: var(--accent2); text-decoration: none; }
  #pPfp a:hover { text-decoration: underline; }
  #pImgs { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 28px 0; }
  #pImgs:empty { padding: 0; }
  #pImgs img {
    max-width: 100%; border-radius: 8px; border: 1px solid var(--hair);
    cursor: zoom-in; display: block;
  }
  #pImgs img.single { width: 100%; }
  #pImgs img.multi { width: calc(50% - 4px); object-fit: cover; aspect-ratio: 1; }
  #lightbox {
    position: fixed; inset: 0; z-index: 50; background: rgba(5,5,8,0.92);
    display: none; align-items: center; justify-content: center; cursor: zoom-out;
    backdrop-filter: blur(8px);
  }
  #lightbox.open { display: flex; }
  #lightbox img { max-width: 92vw; max-height: 92vh; border-radius: 6px; }
  #panel .body { padding: 20px 28px; overflow-y: auto; flex: 1;
    font-size: 13.5px; line-height: 1.65; color: #cfcdd6; white-space: pre-wrap;
    scrollbar-width: thin; scrollbar-color: #333 transparent; }
  #panel .body a { color: var(--accent2); }
  #panel .stubmsg { color: var(--dim); font-style: italic; }
  #panel .conn { padding: 0 28px 8px; }
  #panel .conn h3 { font-size: 10px; letter-spacing: 0.22em; color: var(--dim);
    text-transform: uppercase; margin-bottom: 8px; }
  .tag {
    display: inline-block; margin: 0 6px 6px 0; padding: 3px 10px;
    border: 1px solid var(--hair); border-radius: 12px; font-size: 11.5px;
    color: #b9b7c2; cursor: pointer; background: none; font-family: inherit;
  }
  .tag:hover { border-color: var(--accent); color: var(--accent); }
  #panel footer { padding: 16px 28px 24px; border-top: 1px solid var(--hair);
    display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  #srcBtn, #contribBtn { white-space: nowrap; }
  #contribAlts { flex-basis: 100%; order: 9; display: flex; gap: 14px; font-size: 11.5px; color: var(--dim); }
  #srcBtn {
    display: inline-block; padding: 10px 20px; border-radius: 22px;
    background: var(--accent); color: #14040c; font-size: 12.5px; font-weight: 700;
    letter-spacing: 0.06em; text-decoration: none;
  }
  #srcBtn.disabled { background: #2a2933; color: var(--dim); pointer-events: none; }
  #contribBtn {
    display: inline-block; padding: 9px 18px; border-radius: 22px;
    border: 1px solid var(--hair); color: #b9b7c2; font-size: 12.5px;
    letter-spacing: 0.04em; text-decoration: none;
  }
  #contribBtn:hover { border-color: var(--accent2); color: var(--accent2); }
  .contribAlt { color: var(--dim); font-size: 11.5px; letter-spacing: 0.04em; text-decoration: none; }
  .contribAlt:hover { color: var(--accent2); }
  #pVotes { display: flex; gap: 8px; margin-left: auto; }
  #pVotes.hidden { display: none; }
  .vbtn {
    display: flex; align-items: center; gap: 6px;
    background: none; border: 1px solid var(--hair); border-radius: 16px;
    color: #b9b7c2; padding: 6px 13px; font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .vbtn:hover { border-color: var(--accent2); color: var(--accent2); }
  .vbtn.voted { border-color: var(--accent); color: var(--accent); }
  .vbtn:disabled { opacity: 0.55; cursor: default; }
  #closeBtn {
    position: absolute; top: 18px; right: 18px; background: none; border: none;
    color: var(--dim); font-size: 20px; cursor: pointer; line-height: 1;
  }
  #closeBtn:hover { color: var(--ink); }

  /* ---------- legend ---------- */
  #legend {
    position: fixed; bottom: 16px; left: 16px; z-index: 10;
    display: flex; gap: 14px; flex-wrap: wrap; font-size: 10.5px; color: var(--dim);
  }
  #legend button {
    display: flex; align-items: center; gap: 5px; background: none; border: 1px solid transparent;
    color: var(--dim); font: inherit; font-size: 10.5px; padding: 3px 7px; margin: -3px -3px;
    border-radius: 12px; cursor: pointer;
  }
  #legend button:hover { color: var(--ink); }
  #legend button:focus-visible { outline: none; border-color: var(--accent2); color: var(--ink); }
  #legend button[aria-pressed="true"] { color: var(--ink); border-color: rgba(255,255,255,0.28); background: rgba(255,255,255,0.06); }
  #legend.filtering button[aria-pressed="false"]:not(.lg-all) { opacity: 0.45; }
  #legend i { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
  #legend .lg-faces i { background: conic-gradient(#f0a6ca, #7bdcff, #ffd166, #6ee7a0, #f0a6ca); }
  #legend .lg-faces { color: var(--ink); border-color: rgba(255, 79, 163, 0.55); padding: 3px 9px; margin-right: 4px; }
  #legend .lg-faces:hover { border-color: var(--accent); }
  #legend .lg-faces[aria-pressed="true"] { border-color: var(--accent); background: rgba(255, 79, 163, 0.14); }
  #legend .lg-all { display: none; color: var(--accent2); }
  #legend.filtering .lg-all { display: flex; }

  #hint { position: fixed; bottom: 16px; right: 22px; z-index: 10;
    font-size: 10.5px; color: var(--dim); letter-spacing: 0.05em; }
  #hint a { color: var(--accent2); text-decoration: none; }
  #hint a:hover { text-decoration: underline; }

  @media (max-width: 720px) {
    #keys { display: none; }
    #search { width: 150px; }
    #resetView { right: 184px; }
  }
</style>
</head>
<body>

<div id="hdr">
  <h1>AVANT <em>GAY</em></h1>
  <span>a living archive of the scene on Solana · <a id="hdrRepo" href="#" target="_blank" rel="noopener">contribute ↗</a></span>
</div>
<input id="search" type="text" placeholder="search the archive…" autocomplete="off">
<button id="resetView" type="button" title="Reset zoom and pan, close the open entry (filters stay)">reset view</button>
<nav id="keys"><h2>Keywords</h2><div id="keyList"></div></nav>

<aside id="panel">
  <button id="closeBtn" title="close">×</button>
  <header>
    <div class="ptype" id="pType"></div>
    <h2 id="pTitle"></h2>
    <div class="meta" id="pMeta"></div>
    <div id="pPfp"></div>
  </header>
  <div id="pImgs"></div>
  <div class="body" id="pBody"></div>
  <div class="conn"><h3>Connected</h3><div id="pConn"></div></div>
  <footer>
    <a id="srcBtn" href="#" target="_blank" rel="noopener">Open source ↗</a>
    <a id="contribBtn" href="#" target="_blank" rel="noopener">Add context ✚</a>
    <div id="contribAlts">
      <a id="correctBtn" class="contribAlt" href="#" target="_blank" rel="noopener" title="Fix a factual error, with a source">correct an error ↗</a>
      <a id="contestBtn" class="contribAlt" href="#" target="_blank" rel="noopener" title="Add a different account beside the existing one">contest a claim ↗</a>
    </div>
    <div id="pVotes" class="hidden">
      <button class="vbtn" id="vUp" title="this matters">👍 <span>0</span></button>
      <button class="vbtn" id="vDown" title="disputed / overrated">👎 <span>0</span></button>
    </div>
  </footer>
</aside>

<div id="lightbox"><img alt=""></div>
<div id="legend" role="toolbar" aria-label="Filter by category"></div>
<div id="hint">drag to explore · scroll to zoom · click a node · <a id="hintRepo" href="#" target="_blank" rel="noopener">submit material ✚</a></div>
<canvas id="c"></canvas>

<script>
const DATA = __GRAPH_DATA__;
const REPO = "__REPO__";
const REPO_URL = "https://github.com/" + REPO;
const VOTES_URL = "__VOTES_URL__";

const COLORS = {
  concept:    "#ff4fa3",
  artist:     "#7bdcff",
  collection: "#ffd166",
  article:    "#b39dff",
  platform:   "#6ee7a0",
  reference:  "#f4845f",
  person:     "#f0a6ca",
  event:      "#e6c07b",
  phantom:    "#57565f",
};
const TYPE_LABEL = {
  concept: "concept / lore", artist: "artist", collection: "collection",
  article: "article / thread", platform: "platform", reference: "imagery reference",
  person: "person", event: "event / exhibition",
  phantom: "mentioned — no note yet",
};

// Contribution paths (see AGENTS.md): new entry, addition, correction, perspective/contest.
const GUIDE_URL = REPO_URL + "/blob/main/AGENTS.md";
const FORMS = { addition: "contribute.yml", correction: "correction.yml", perspective: "contest.yml", "new-entry": "new-entry.yml" };
function contribUrl(node, kind) {
  if (!node) return REPO_URL + "/issues/new/choose";
  const k = kind || (node.type === "phantom" ? "new-entry" : "addition");
  const title = k === "new-entry" ? "New entry: " + node.id : "[" + node.id + "] " + k + ": ";
  return REPO_URL + "/issues/new?template=" + FORMS[k] + "&title=" + encodeURIComponent(title);
}
document.getElementById("hdrRepo").href = GUIDE_URL;
document.getElementById("hintRepo").href = contribUrl(null);

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
let W, H, dpr = window.devicePixelRatio || 1;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  canvas.style.width = W + "px"; canvas.style.height = H + "px";
}
resize(); window.addEventListener("resize", () => { resize(); tick(); });

const nodes = DATA.nodes;
const links = DATA.links.map(l => ({...l}));
const byId = new Map(nodes.map(n => [n.id, n]));
nodes.forEach(n => { n.r = 3 + Math.sqrt(n.degree || 0) * 2.1; });

// ---------- X profile pictures (local copies only, see website/pfp/manifest.json) ----------
// Each image is pre-cropped once into a circular offscreen canvas, so drawing stays cheap.
const PFP_MIN_PX = 7;   // show the picture only when the node is at least this many screen px in radius
let pfpRedraw = 0;
nodes.forEach(n => {
  if (!n.pfp) return;
  const im = new Image();
  im.decoding = "async";
  im.onload = () => {
    const S = 128, c = document.createElement("canvas");
    c.width = c.height = S;
    const g = c.getContext("2d");
    g.beginPath(); g.arc(S / 2, S / 2, S / 2, 0, 2 * Math.PI); g.clip();
    g.drawImage(im, 0, 0, S, S);
    n.pfpImg = c;
    if (!pfpRedraw) pfpRedraw = requestAnimationFrame(() => { pfpRedraw = 0; tick(); });
  };
  im.onerror = () => { n.pfp = null; };
  im.src = n.pfp;
});

// neighbor map
const nbrs = new Map(nodes.map(n => [n.id, new Set()]));
links.forEach(l => { nbrs.get(l.source)?.add(l.target); nbrs.get(l.target)?.add(l.source); });

let selected = null, hovered = null, focusSet = null;

// ---------- category filter (legend) ----------
// filter = null shows everything; otherwise a Set of node types, or the special "faces" view.
let filter = null;
const FACES = "faces";
function shown(n) {
  if (n === selected) return true;
  if (!filter) return true;
  if (filter.has(FACES)) return !!n.pfp;
  return filter.has(n.type);
}
// In the faces view, pictures are drawn at a legible minimum size (drawing only; layout unchanged).
function drawR(n) {
  if (filter && filter.has(FACES) && n.pfp) return Math.max(n.r, 10 / transform.k);
  return n.r;
}

// ---------- labels ----------
// Size-priority labels with a simple screen-space collision check.
const LABEL_MIN_PX = 9;  // a node earns a label once its on-screen radius reaches this (cf. PFP_MIN_PX)
const LABEL_FONT = "Helvetica, Arial, sans-serif";
const byDegree = [...nodes].sort((a, b) => b.degree - a.degree);
function labelWidth(n, px, bold) {
  const key = bold ? "_wb" : "_w";
  if (n[key] === undefined) {
    ctx.font = (bold ? "700 " : "") + "10px " + LABEL_FONT;
    n[key] = ctx.measureText(n.id).width / 10;
  }
  return n[key] * px;
}

const sim = d3.forceSimulation(nodes)
  .force("link", d3.forceLink(links).id(d => d.id).distance(d => 46).strength(0.25))
  .force("charge", d3.forceManyBody().strength(d => -60 - d.degree * 4))
  .force("center", d3.forceCenter(0, 0))
  .force("collide", d3.forceCollide(d => d.r + 3))
  .on("tick", tick);

let transform = d3.zoomIdentity.translate(W / 2 + 40, H / 2).scale(0.85);
const zoom = d3.zoom().scaleExtent([0.12, 6])
  // Let a press on a node go to node dragging; empty space pans, wheel always zooms.
  .filter(e => {
    if (e.type === "wheel") return true;
    if (e.button) return false;
    const pt = e.touches ? e.touches[0] : e;
    const r = canvas.getBoundingClientRect();
    return !pick(pt.clientX - r.left, pt.clientY - r.top);
  })
  .on("zoom", e => { transform = e.transform; tick(); });
d3.select(canvas).call(zoom).call(zoom.transform, transform);

function tick() {
  ctx.save();
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.scale(dpr, dpr);
  ctx.translate(transform.x, transform.y);
  ctx.scale(transform.k, transform.k);

  const k = transform.k;
  const active = selected || hovered;
  const hi = focusSet || (active ? new Set([active.id, ...nbrs.get(active.id)]) : null);

  // links
  for (const l of links) {
    const hidden = !(shown(l.source) && shown(l.target));
    const dimmed = hidden || (hi && !(hi.has(l.source.id) && hi.has(l.target.id)));
    ctx.strokeStyle = hidden ? "rgba(120,120,140,0.025)" : dimmed ? "rgba(120,120,140,0.05)" : "rgba(170,168,190,0.22)";
    ctx.lineWidth = dimmed ? 0.5 : 0.8;
    ctx.beginPath();
    ctx.moveTo(l.source.x, l.source.y);
    ctx.lineTo(l.target.x, l.target.y);
    ctx.stroke();
  }
  // nodes
  for (const n of nodes) {
    const vis = shown(n);
    const dimmed = !vis || (hi && !hi.has(n.id));
    const col = COLORS[n.type] || COLORS.phantom;
    const r = drawR(n);
    ctx.globalAlpha = !vis ? 0.05 : dimmed ? 0.13 : 1;
    if (n.pfpImg && r * k >= PFP_MIN_PX) {
      // circular picture with a ring in the category colour; ring thickens on hover/selection
      const on = n === hovered || n === selected;
      const ring = (on ? 3 : 1.6) / k;
      ctx.drawImage(n.pfpImg, n.x - r, n.y - r, 2 * r, 2 * r);
      ctx.strokeStyle = col; ctx.lineWidth = ring;
      if (on) { ctx.shadowColor = col; ctx.shadowBlur = 10; }
      ctx.beginPath(); ctx.arc(n.x, n.y, r - ring / 2, 0, 2 * Math.PI); ctx.stroke();
      ctx.shadowBlur = 0;
    } else {
      ctx.beginPath();
      ctx.arc(n.x, n.y, r, 0, 2 * Math.PI);
      ctx.fillStyle = col;
      ctx.fill();
      if (n === hovered && n.pfpImg) { ctx.strokeStyle = "rgba(255,255,255,0.7)"; ctx.lineWidth = 1.2 / k; ctx.stroke(); }
    }
    if (n === selected) {
      ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.6 / k;
      ctx.beginPath(); ctx.arc(n.x, n.y, r + 3 / k, 0, 2 * Math.PI); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
  ctx.restore();

  // labels, drawn in screen space so collision boxes are in pixels
  ctx.save();
  ctx.scale(dpr, dpr);
  ctx.textAlign = "center"; ctx.textBaseline = "top";
  const placed = [];
  const fits = b => {
    for (const p of placed) if (b.x0 < p.x1 && b.x1 > p.x0 && b.y0 < p.y1 && b.y1 > p.y0) return false;
    return true;
  };
  const forced = new Set();
  if (selected) forced.add(selected);
  if (hovered) forced.add(hovered);
  // order: forced first, then the active node's neighbours / search hits, then everything by size
  const order = [...forced];
  if (hi) for (const n of byDegree) if (hi.has(n.id) && !forced.has(n)) order.push(n);
  for (const n of byDegree) if (!forced.has(n) && !(hi && hi.has(n.id))) order.push(n);
  for (const n of order) {
    const isForced = forced.has(n);
    if (!isForced) {
      if (!shown(n)) continue;
      if (hi && !hi.has(n.id)) continue;
      const related = hi && hi.has(n.id);
      if (!related && drawR(n) * k < LABEL_MIN_PX) continue;
    }
    const big = n.degree >= 12;
    const px = Math.max(9, Math.min(18, (8 + n.degree * 0.25) * Math.sqrt(k)));
    const [sx, sy] = transform.apply([n.x, n.y]);
    const y = sy + drawR(n) * k + 3;
    if (sx < -200 || sx > W + 200 || y < -40 || y > H + 40) continue;
    const w = labelWidth(n, px, big);
    const box = { x0: sx - w / 2 - 2, x1: sx + w / 2 + 2, y0: y - 1, y1: y + px + 1 };
    if (!isForced && !fits(box)) continue;
    placed.push(box);
    ctx.font = (big || isForced ? "700 " : "") + px + "px " + LABEL_FONT;
    if (isForced) {  // keep the selected/hovered label readable on top of the graph
      ctx.lineWidth = 3; ctx.strokeStyle = "rgba(11,11,16,0.85)"; ctx.strokeText(n.id, sx, y);
    }
    ctx.fillStyle = isForced || big ? "rgba(240,238,245,0.95)" : "rgba(200,198,212,0.8)";
    ctx.fillText(n.id, sx, y);
  }
  ctx.restore();
}

function pick(mx, my) {
  const [x, y] = transform.invert([mx, my]);
  let best = null, bd = Infinity;
  for (const n of nodes) {
    if (!shown(n)) continue;
    const d = Math.hypot(n.x - x, n.y - y);
    if (d < Math.max(drawR(n) + 4, 8) && d < bd) { best = n; bd = d; }
  }
  return best;
}

// drag nodes vs pan: d3.zoom handles pan; use drag filter
d3.select(canvas).call(
  d3.drag()
    .container(canvas)
    .subject(e => pick(e.x, e.y))
    .on("start", e => { if (!e.active) sim.alphaTarget(0.25).restart(); e.subject.fx = e.subject.x; e.subject.fy = e.subject.y; })
    .on("drag", e => {
      // e.x/e.y are offset from the subject's simulation coords; use the real pointer instead.
      const [x, y] = transform.invert(d3.pointer(e.sourceEvent.touches ? e.sourceEvent.touches[0] : e.sourceEvent, canvas));
      e.subject.fx = x; e.subject.fy = y;
    })
    .on("end", e => { if (!e.active) sim.alphaTarget(0); e.subject.fx = null; e.subject.fy = null; })
);

canvas.addEventListener("mousemove", e => {
  const n = pick(e.clientX, e.clientY);
  if (n !== hovered) { hovered = n; canvas.style.cursor = n ? "pointer" : "grab"; tick(); }
});
canvas.addEventListener("click", e => {
  const n = pick(e.clientX, e.clientY);
  if (n) select(n); else deselect();
});

// ---------- panel ----------
const panel = document.getElementById("panel");
function select(n, fromKey) {
  selected = n; focusSet = null;
  if (!fromKey) document.querySelectorAll(".key.active").forEach(k => k.classList.remove("active"));
  const col = COLORS[n.type] || COLORS.phantom;
  document.getElementById("pType").textContent = TYPE_LABEL[n.type] || n.type;
  document.getElementById("pType").style.color = col;
  document.getElementById("pTitle").textContent = n.id;
  const meta = [];
  if (n.author) meta.push("by " + n.author.replace(/\[\[|\]\]/g, ""));
  if (n.date) meta.push(n.date);
  if (n.status) meta.push(String(n.status).replace(/-/g, " "));
  meta.push(n.backlinks + " backlinks");
  document.getElementById("pMeta").textContent = meta.join("  ·  ");
  const pf = document.getElementById("pPfp");
  pf.innerHTML = "";
  if (n.xHandle) {
    const h = n.xHandle, url = "https://x.com/" + encodeURIComponent(h);
    if (n.pfp) {
      const im = document.createElement("img");
      im.src = n.pfp; im.alt = "X profile picture of @" + h;
      im.style.borderColor = col;
      pf.appendChild(im);
    }
    const cap = document.createElement("div");
    cap.className = "cap";
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener"; a.textContent = "@" + h;
    cap.append(n.pfp ? "X profile picture of " : "On X: ", a);
    if (n.pfp && n.pfpCaptured) {
      const [d, m, y] = n.pfpCaptured.split("/");
      const mon = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+m - 1];
      cap.append(", captured " + (+d) + " " + mon + " " + y + ".");
      cap.appendChild(document.createElement("br"));
      cap.append("Profile pictures may be artworks by others.");
    }
    pf.appendChild(cap);
  }
  const imgs = document.getElementById("pImgs");
  imgs.innerHTML = "";
  (n.images || []).forEach(u => {
    const im = document.createElement("img");
    im.src = u; im.loading = "lazy";
    im.className = (n.images.length === 1) ? "single" : "multi";
    im.onclick = () => {
      const lb = document.getElementById("lightbox");
      lb.querySelector("img").src = u;
      lb.classList.add("open");
    };
    imgs.appendChild(im);
  });
  const body = document.getElementById("pBody");
  if (n.summary && n.summary.trim().length > 5) {
    body.textContent = n.summary
      .replace(/\[\[([^\]|]+)(\|[^\]]+)?\]\]/g, "$1")
      .replace(/\*\*([^*]+)\*\*/g, "$1")
      .replace(/\*([^*\n]+)\*/g, "$1")
      .replace(/^#{1,6}\s*/gm, "")
      .replace(/^\s*-\s+/gm, "· ");
  } else {
    body.innerHTML = '<span class="stubmsg">' + (n.type === "phantom"
      ? "This entity is referenced across the archive but doesn’t have its own entry yet. Know the story? Use “Write this entry” below."
      : "Entry exists but hasn’t been written yet. Know the story? Use “Add context” below.") + "</span>";
  }
  const conn = document.getElementById("pConn");
  conn.innerHTML = "";
  [...(nbrs.get(n.id) || [])]
    .map(id => byId.get(id)).filter(Boolean)
    .sort((a, b) => b.degree - a.degree).slice(0, 14)
    .forEach(m => {
      const b = document.createElement("button");
      b.className = "tag"; b.textContent = m.id;
      b.onclick = () => { select(m); centerOn(m); };
      conn.appendChild(b);
    });
  const src = document.getElementById("srcBtn");
  if (n.source) { src.href = n.source; src.classList.remove("disabled"); src.textContent = "Open source ↗"; }
  else { src.href = "#"; src.classList.add("disabled"); src.textContent = "No source link"; }
  const cb = document.getElementById("contribBtn");
  cb.href = contribUrl(n);
  cb.textContent = n.type === "phantom" ? "Write this entry ✚" : "Add context ✚";
  for (const [id, k] of [["correctBtn", "correction"], ["contestBtn", "perspective"]]) {
    const a = document.getElementById(id);
    a.href = contribUrl(n, k);
    a.style.display = n.type === "phantom" ? "none" : "";
  }
  renderVotes(n);
  panel.classList.add("open");
  tick();
}

// ---------- votes ----------
let voteCounts = {};
const votesOn = VOTES_URL.startsWith("http");
if (votesOn) {
  fetch(VOTES_URL + "/votes").then(r => r.json())
    .then(c => { voteCounts = c; if (selected) renderVotes(selected); })
    .catch(() => {});
}
function renderVotes(n) {
  const wrap = document.getElementById("pVotes");
  if (!votesOn) { wrap.classList.add("hidden"); return; }
  wrap.classList.remove("hidden");
  const c = voteCounts[n.id] || { up: 0, down: 0 };
  const mine = localStorage.getItem("vote:" + n.id);
  [["vUp", "up"], ["vDown", "down"]].forEach(([elId, dir]) => {
    const b = document.getElementById(elId);
    b.querySelector("span").textContent = c[dir];
    b.classList.toggle("voted", mine === dir);
    b.disabled = !!mine;
    b.onclick = () => castVote(n, dir);
  });
}
function castVote(n, dir) {
  if (localStorage.getItem("vote:" + n.id)) return;
  localStorage.setItem("vote:" + n.id, dir);
  const c = voteCounts[n.id] || (voteCounts[n.id] = { up: 0, down: 0 });
  c[dir] += 1;
  renderVotes(n);
  fetch(VOTES_URL + "/vote", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: n.id, dir }),
  }).then(r => r.ok ? r.json() : null)
    .then(real => { if (real) { voteCounts[n.id] = real; if (selected === n) renderVotes(n); } })
    .catch(() => {});
}
function deselect() {
  selected = null; focusSet = null;
  panel.classList.remove("open");
  document.querySelectorAll(".key.active").forEach(k => k.classList.remove("active"));
  tick();
}
document.getElementById("closeBtn").onclick = deselect;
document.getElementById("lightbox").onclick = e => e.currentTarget.classList.remove("open");

function centerOn(n) {
  const t = d3.zoomIdentity.translate(W / 2 - 90, H / 2).scale(Math.max(transform.k, 1.4))
    .translate(-n.x, -n.y);
  d3.select(canvas).transition().duration(600).call(zoom.transform, t);
}

// ---------- keyword sidebar ----------
const keyList = document.getElementById("keyList");
const ranked = [...nodes].sort((a, b) => b.degree - a.degree).slice(0, 30);
const maxDeg = ranked[0]?.degree || 1;
ranked.forEach(n => {
  const b = document.createElement("button");
  b.className = "key";
  b.innerHTML = '<span class="n">' + n.degree + '</span><span>' + n.id +
    '</span><span class="bar" style="width:' + Math.max(4, (n.degree / maxDeg) * 46) + 'px"></span>';
  b.onclick = () => {
    document.querySelectorAll(".key.active").forEach(k => k.classList.remove("active"));
    b.classList.add("active");
    select(n, true); centerOn(n);
  };
  keyList.appendChild(b);
});

// ---------- search ----------
document.getElementById("search").addEventListener("input", e => {
  const q = e.target.value.trim().toLowerCase();
  if (!q) { focusSet = null; tick(); return; }
  focusSet = new Set(nodes.filter(n =>
    n.id.toLowerCase().includes(q) || (n.summary || "").toLowerCase().includes(q)
  ).map(n => n.id));
  tick();
});
document.getElementById("search").addEventListener("keydown", e => {
  if (e.key === "Enter" && focusSet && focusSet.size) {
    // prefer matches the current category filter shows, then the best-connected
    const rank = id => (shown(byId.get(id)) ? 1e6 : 0) + byId.get(id).degree;
    const n = byId.get([...focusSet].sort((a, b) => rank(b) - rank(a))[0]);
    if (n) { select(n); centerOn(n); }
  }
});

// ---------- legend: category filters ----------
// Click a category to show only it; click more to add them; click an active one to remove it.
// "faces" shows persona nodes that have an X profile picture. "show all" resets.
const legend = document.getElementById("legend");
const legendBtns = new Map();
function setFilter(f) {
  filter = f && f.size ? f : null;
  legend.classList.toggle("filtering", !!filter);
  legendBtns.forEach((b, key) => b.setAttribute("aria-pressed", String(!!filter && filter.has(key))));
  if (hovered && !shown(hovered)) hovered = null;
  tick();
}
function legendButton(key, html, cls, title) {
  const b = document.createElement("button");
  b.type = "button"; b.className = cls || ""; b.innerHTML = html; b.title = title;
  b.setAttribute("aria-pressed", "false");
  legend.appendChild(b);
  if (key) legendBtns.set(key, b);
  return b;
}
const facesCount = nodes.filter(n => n.pfp).length;
legendButton(FACES, '<i></i>faces (' + facesCount + ')', "lg-faces", "Show only people and accounts with an X profile picture")
  .onclick = () => setFilter(filter && filter.has(FACES) ? null : new Set([FACES]));
Object.entries(TYPE_LABEL).forEach(([t, label]) => {
  legendButton(t, '<i style="background:' + COLORS[t] + '"></i>' + label, "", "Show " + label + " (click again to remove)")
    .onclick = () => {
      if (!filter || filter.has(FACES)) return setFilter(new Set([t]));
      const f = new Set(filter);
      f.has(t) ? f.delete(t) : f.add(t);
      setFilter(f);
    };
});
legendButton(null, "× show all", "lg-all", "Clear the category filter").onclick = () => setFilter(null);

// ---------- reset view ----------
const DEFAULT_VIEW = () => d3.zoomIdentity.translate(W / 2 + 40, H / 2).scale(0.85);
function resetView() {
  if (selected) deselect();
  d3.select(canvas).transition().duration(500).call(zoom.transform, DEFAULT_VIEW());
}
document.getElementById("resetView").onclick = resetView;
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.activeElement?.id !== "search") {
    if (document.getElementById("lightbox").classList.contains("open")) return;
    if (selected) deselect(); else if (filter) setFilter(null);
  }
});
</script>
</body>
